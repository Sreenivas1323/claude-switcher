name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent ClaudeSwitcher.app ClaudeSwitcher.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher
          path: build/ClaudeSwitcher.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ClaudeSwitcher.zip --generate-notes --title "$GITHUB_REF_NAME"
